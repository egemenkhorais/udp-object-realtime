project:
  name: udp-object-realtime
  seed: 42
dataset:
  raw_dir: data/raw
  processed_dir: data/processed/visdrone_det
  yaml_path: data/processed/visdrone_det/visdrone.yaml
model:
  weights: weights/visdrone_yolo11n.pt
  device: auto
  imgsz: 960
  conf_threshold: 0.25
  iou_threshold: 0.45
train:
  epochs: 50
  batch_size: 16
  workers: 4
  project_dir: runs/phase1
  run_name: visdrone_yolo11n_960
tracking:
  enabled: true
  track_activation_threshold: 0.25   
  lost_track_buffer: 30
  minimum_matching_threshold: 0.8
  frame_rate: 30
  trail_length: 20